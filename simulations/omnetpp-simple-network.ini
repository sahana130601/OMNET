[General]
network = SimpleNetwork


#simulation control parameters
sim-time-limit = 200s # 2 days
repeat = 1


# RNG initialization
# seed-0-mt = 1000
# seed-1-mt = 2000
# seed-2-mt = 3000
# seed-3-mt = 4000
# seed-4-mt = 5000
# seed-5-mt = 6000
# seed-6-mt = 7000
# seed-7-mt = 8000
num-rngs = 8

# RNG use
**.demiurge.rng-0 = 1
**.numen.rng-0 = 2
**.app[*].rng-0 = 3
**.fwd.rng-0 = 4
**.wired[*].rng-0 = 5
**.wireless[*].rng-0 = 6
**.mobility.rng-0 = 7


# results location
result-dir = results/
output-vector-file = "${resultdir}/${inifile}-${configname}-${runnumber}.vec"
output-scalar-file = "${resultdir}/${inifile}-${configname}-${runnumber}.sca"


# statistic collection
**.vector-recording = true
**.scalar-recording = true
**.statistic-recording = true


# log events
record-eventlog = false
eventlog-file = "${resultdir}/${inifile}-${configname}-${runnumber}.elog"


[Config Simple-Net]


# Content Server 1 settings
**.contentServer1.numApps = 1
**.contentServer1.app[0].typename = "ContentHostApp"
**.contentServer1.app[0].hostedPrefixNames = "ccnx://spacetime.com/"
**.contentServer1.app[0].dataNamePrefix = "sptm"
**.contentServer1.app[0].segmentSize = 1000byte
**.contentServer1.app[0].numSegmentsPerFile = intuniform(5, 20)
**.contentServer1.app[0].cacheTime = 2h


# Content Server 2 settings
**.contentServer2.numApps = 1
**.contentServer2.app[0].typename = "ContentHostApp"
**.contentServer2.app[0].hostedPrefixNames = "ccnx://relativity.com/"
**.contentServer2.app[0].dataNamePrefix = "rltv"
**.contentServer2.app[0].segmentSize = 1000byte
**.contentServer2.app[0].numSegmentsPerFile = intuniform(5, 20)
**.contentServer2.app[0].cacheTime = 2h


# Wireless Node settings
**.wirelessNode[*].numApps = 1
**.wirelessNode[*].app[0].typename = "ContentDownloadApp"
**.wirelessNode[*].app[0].interContentDownloadInterval = uniform(100.0s, 150.0s)
**.wirelessNode[*].app[0].requestedPrefixNames = "ccnx://spacetime.com/"
**.wirelessNode[*].app[0].dataNamePrefix = "sptm"
**.wirelessNode[*].app[0].interestRetransmitTimeout = 120s
**.wirelessNode[*].app[0].nextFileSuffix = intuniform(0, 99)
**.wirelessNode[*].btWirelessRange = 30m
**.wirelessNode[*].wlanWirelessRange = 100m


# Wireless Node Mobility settings
**.wirelessNode[*].**.constraintAreaMinX = 50m
**.wirelessNode[*].**.constraintAreaMinY = 50m
**.wirelessNode[*].**.constraintAreaMinZ = 0m
**.wirelessNode[*].**.constraintAreaMaxX = 150m
**.wirelessNode[*].**.constraintAreaMaxY = 150m
**.wirelessNode[*].**.constraintAreaMaxZ = 0m
**.wirelessNode[*].mobility = "RandomWaypointMobility"
**.wirelessNode[*].**.speed = uniform(1mps, 2mps)
**.wirelessNode[*].**.waitTime = uniform(1200s, 1800s)


# Wireless Access Router mobility settings
**.wirelessAccessRouter.wlanWirelessRange = 100m


# Wired Access Router Settings
**.accessRouter.accessRouterNumWiredTransports = 3


# Wired Node settings
**.wiredNode*.numApps = 1
**.wiredNode*.app[0].typename = "ContentDownloadApp"
**.wiredNode*.app[0].interContentDownloadInterval = uniform(100.0s, 150.0s)
**.wiredNode*.app[0].requestedPrefixNames = "ccnx://relativity.com/"
**.wiredNode*.app[0].dataNamePrefix = "rltv"
**.wiredNode*.app[0].interestRetransmitTimeout = 120s
**.wiredNode*.app[0].nextFileSuffix = intuniform(0, 9)


# Core Router settings
**.coreRouter1.coreRouterNumWiredTransports = 4
**.coreRouter2.coreRouterNumWiredTransports = 2


# General Mobility settings
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 400m
**.constraintAreaMaxY = 400m
**.constraintAreaMaxZ = 0m
**.updateInterval = 1s
**.initFromDisplayString = true


[Config HeavyInet]
network = SimpleInetUdpCcnNetwork
sim-time-limit = 200s
repeat = 15
seed-set = ${runnumber}

output-scalar-file = results/heavy-inet-${runnumber}.sca
output-vector-file = results/heavy-inet-${runnumber}.vec

# Enable INET UDP mode
**.adaptationLayer.udpMode = true
**.adaptationLayer.inetUdpMode = true

# Consumer AdaptationLayer UDP settings
**.inetWiredNode1.adaptationLayer.localPort = 9695
**.inetWiredNode1.adaptationLayer.destPort = 9695
**.inetWiredNode1.adaptationLayer.destAddress = "inetContentServer1"

# Server AdaptationLayer UDP settings
**.inetContentServer1.adaptationLayer.localPort = 9695
**.inetContentServer1.adaptationLayer.destPort = 9695
**.inetContentServer1.adaptationLayer.destAddress = "inetWiredNode1"

# Consumer application
**.inetWiredNode1.numApps = 1
**.inetWiredNode1.app[0].typename = "ContentDownloadApp"
**.inetWiredNode1.app[0].interContentDownloadInterval = uniform(5s, 10s)
**.inetWiredNode1.app[0].requestedPrefixNames = "ccnx://relativity.com/"
**.inetWiredNode1.app[0].dataNamePrefix = "rltv"
**.inetWiredNode1.app[0].interestRetransmitTimeout = 60s
**.inetWiredNode1.app[0].nextFileSuffix = intuniform(0, 9)

# Content server application
**.inetContentServer1.numApps = 1
**.inetContentServer1.app[0].typename = "ContentHostApp"
**.inetContentServer1.app[0].hostedPrefixNames = "ccnx://relativity.com/"
**.inetContentServer1.app[0].dataNamePrefix = "rltv"

# Smaller payload so one ICN Content Object fits into one UDP/IP packet
**.inetContentServer1.app[0].segmentSize = 200byte

# Heavy traffic content size
**.inetContentServer1.app[0].numSegmentsPerFile = intuniform(20, 40)
**.inetContentServer1.app[0].cacheTime = 2h

# Mobility/general area settings
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 400m
**.constraintAreaMaxY = 400m
**.constraintAreaMaxZ = 0m
**.updateInterval = 1s
**.initFromDisplayString = true